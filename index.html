  <script>
    const INTRO_SEGMENTS = [
      [
        "In an age when the world was whole,",
        "there was a game of such perfect proportions",
        "that it could capture any idea."
      ],
      [
        "Art, science, and religion were understood as one,",
        "woven together by the patterns",
        "that mirrored life and mind itself."
      ],
      [
        "Yet wholeness did not last."
      ],
      [
        "Division entered the world,",
        "and with it the Game split itself in two:"
      ],
      [
        "Its body journeyed West and",
        "became known as <strong>Chess</strong>,"
      ],
      [
        "while its spirit traveled East and",
        "was called the <strong>I Ching</strong>."
      ],
      [
        "Now, at last, their long",
        "separation draws to a close."
      ],
      [
        "In Intrachange, body and spirit meet again.",
        "The Game returns to itself."
      ]
    ];

    const INITIAL_DELAY_MS = 500;
    const SEGMENT_DISPLAY_DURATIONS_MS = [5040, 5040, 1800, 3600, 3600, 3600, 4200, 4200];
    const SEGMENT_BREAK_DURATIONS_MS = [1400, 1400, 1800, 1800, 1800, 1800, 1800];
    const LINE_STAGGER_MS = 0;

    const introSegments = document.getElementById("introSegments");
    const skipIntroButton = document.getElementById("skipIntroButton");
    const progressDots = Array.from(document.querySelectorAll(".progress-dot"));
    let nextSegmentIndex = 0;
    let introTimerId = null;
    let isShowingBreak = true;

    function updateProgress() {
      progressDots.forEach((dot, index) => {
        dot.classList.remove("active", "completed");
        if (index < nextSegmentIndex) {
          dot.classList.add("completed");
        } else if (!isShowingBreak && index === nextSegmentIndex) {
          dot.classList.add("active");
        }
      });
    }

    function renderSegment(segmentLines) {
      introSegments.replaceChildren();

      segmentLines.forEach((line, index) => {
        const paragraph = document.createElement("p");
        paragraph.className = "segment";
        paragraph.style.animationDelay = `${index * LINE_STAGGER_MS}ms`;
        paragraph.innerHTML = line;
        introSegments.appendChild(paragraph);
      });

      introSegments.classList.add("active");
      updateProgress();

      window.requestAnimationFrame(() => {
        introSegments.querySelectorAll(".segment").forEach((segment) => {
          segment.classList.add("is-visible");
        });
      });
    }

    function clearSegmentDisplay() {
      introSegments.replaceChildren();
      updateProgress();
    }

    function queueNextStep(delay) {
      introTimerId = window.setTimeout(runIntroStep, delay);
    }

    function getTotalIntroDuration() {
      const displayDuration = SEGMENT_DISPLAY_DURATIONS_MS.reduce((sum, duration) => sum + duration, 0);
      const breakDuration = SEGMENT_BREAK_DURATIONS_MS.reduce((sum, duration) => sum + duration, 0);
      return INITIAL_DELAY_MS + displayDuration + breakDuration;
    }

    function runIntroStep() {
      introTimerId = null;

      if (isShowingBreak) {
        isShowingBreak = false;

        if (nextSegmentIndex >= INTRO_SEGMENTS.length) {
          return;
        }

        renderSegment(INTRO_SEGMENTS[nextSegmentIndex]);

        if (nextSegmentIndex < INTRO_SEGMENTS.length - 1) {
          queueNextStep(SEGMENT_DISPLAY_DURATIONS_MS[nextSegmentIndex]);
        }

        nextSegmentIndex += 1;
        return;
      }

      if (nextSegmentIndex >= INTRO_SEGMENTS.length) {
        return;
      }

      clearSegmentDisplay();
      isShowingBreak = true;
      queueNextStep(SEGMENT_BREAK_DURATIONS_MS[nextSegmentIndex - 1]);
    }

    function showAllSegments() {
      if (introTimerId !== null) {
        window.clearTimeout(introTimerId);
        introTimerId = null;
      }

      introSegments.replaceChildren();

      INTRO_SEGMENTS.forEach((segmentLines, segmentIndex) => {
        segmentLines.forEach((line) => {
          const paragraph = document.createElement("p");
          paragraph.className = "segment is-visible";
          paragraph.style.animationDelay = "0ms";
          paragraph.innerHTML = line;
          introSegments.appendChild(paragraph);
        });

        if (segmentIndex < INTRO_SEGMENTS.length - 1) {
          const spacer = document.createElement("p");
          spacer.className = "segment is-visible";
          spacer.innerHTML = "&nbsp;";
          introSegments.appendChild(spacer);
        }
      });

      nextSegmentIndex = INTRO_SEGMENTS.length;
      isShowingBreak = false;
      progressDots.forEach((dot) => {
        dot.classList.remove("active");
        dot.classList.add("completed");
      });
    }

    skipIntroButton.addEventListener("click", showAllSegments);

    document.documentElement.style.setProperty("--graphic-settle-duration", `${getTotalIntroDuration()}ms`);

    queueNextStep(INITIAL_DELAY_MS);
  </script>
