<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intrachange Archives</title>
<link rel="icon" type="image/jpeg" href="img/icon.jpg">
<style>
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #f4f1e8 0%, #e8e0d0 100%);
    min-height: 100vh;
    margin: 0;
    padding: 2rem;
    color: #4a554a;
    line-height: 1.5;
  }

  .header {
    text-align: center;
    margin-bottom: 3rem;
  }

  h1 {
    font-weight: bold;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    color: #5a645a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }
  
  .icon {
    width: 40px;
    height: 40px;
    object-fit: contain;
  }

  .subtitle {
    color: #7a8d7a;
    font-size: 1rem;
    margin-bottom: 2rem;
  }

  .archive-stats {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-bottom: 2rem;
    font-size: 0.9rem;
    color: #6a746a;
  }

  .stat-item {
    text-align: center;
  }

  .stat-number {
    display: block;
    font-size: 1.8rem;
    font-weight: 600;
    color: #5a645a;
  }

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .archive-card {
    background-color: #fafcfa;
    border: 1px solid #d0d8d0;
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 2px 8px rgba(90, 100, 90, 0.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .archive-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(90, 100, 90, 0.15);
    border-color: #a8b5a8;
  }

  .game-name {
    font-weight: 600;
    margin-bottom: 0.75rem;
    font-size: 1.2rem;
    color: #5a645a;
    border-bottom: 1px solid #e8ece8;
    padding-bottom: 0.5rem;
  }

  .players {
    display: flex;
    justify-content: space-between;
    margin-bottom: 1rem;
    font-size: 0.95rem;
    background-color: #f5f8f5;
    padding: 0.75rem;
    border-radius: 6px;
    border-left: 3px solid #8a9d8a;
  }

  .player {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .player-label {
    font-size: 0.8rem;
    color: #7a8d7a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .player-name {
    font-weight: 500;
    color: #4a554a;
  }

  .game-result {
    text-align: center;
    padding: 0.5rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-weight: 500;
    font-size: 0.9rem;
  }

  .result-white-wins {
    background-color: #f8f9f8;
    color: #5a645a;
    border: 1px solid #d8dcd8;
  }

  .result-black-wins {
    background-color: #f6f7f6;
    color: #4a554a;
    border: 1px solid #d0d4d0;
  }

  .result-draw {
    background-color: #f9f9f9;
    color: #6a746a;
    border: 1px solid #dcdcdc;
  }

  .details {
    font-size: 0.85rem;
    margin-bottom: 1.25rem;
    line-height: 1.6;
    color: #6a746a;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.25rem;
    padding: 0.25rem 0;
  }

  .detail-label {
    font-weight: 500;
    color: #5a645a;
  }

  .detail-value {
    color: #4a554a;
  }

  .card-actions {
    display: flex;
    gap: 0.75rem;
    margin-top: auto;
  }

  .replay-button {
    flex: 1;
    padding: 0.75rem;
    border: none;
    border-radius: 6px;
    background-color: #8a9d8a;
    color: white;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s ease;
  }

  .replay-button:hover {
    background-color: #7a8d7a;
    transform: translateY(-1px);
  }

  .view-details-button {
    padding: 0.75rem 1rem;
    border: 1px solid #d0d8d0;
    border-radius: 6px;
    background-color: transparent;
    color: #6a746a;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s ease;
  }

  .view-details-button:hover {
    background-color: #f5f8f5;
    border-color: #a8b5a8;
    color: #5a645a;
  }

  .load-more {
    text-align: center;
    margin-top: 3rem;
  }

  .load-more-button {
    padding: 1rem 2rem;
    border: 1px solid #d0d8d0;
    border-radius: 8px;
    background-color: #fafcfa;
    color: #6a746a;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s ease;
  }

  .load-more-button:hover {
    background-color: #f5f8f5;
    border-color: #a8b5a8;
    color: #5a645a;
  }

  .return-to-dashboard {
    text-align: center;
    margin-top: 2rem;
  }

  .return-to-dashboard-button {
    padding: 1rem 2rem;
    border: 1px solid #8a9d8a;
    border-radius: 8px;
    background-color: #8a9d8a;
    color: #ffffff;
    cursor: pointer;
    font-size: 1rem;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s ease;
  }

  .return-to-dashboard-button:hover {
    background-color: #7a8d7a;
    border-color: #7a8d7a;
    transform: translateY(-1px);
  }

  .archive-empty {
    text-align: center;
    padding: 4rem 2rem;
    color: #7a8d7a;
  }

  .archive-empty h3 {
    color: #6a746a;
    margin-bottom: 1rem;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    body {
      padding: 1rem;
    }
    
    .archive-grid {
      grid-template-columns: 1fr;
    }
    
    .archive-stats {
      flex-direction: column;
      gap: 1rem;
    }
    
    h1 {
      font-size: 2rem;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <img src="img/icon.jpg" alt="Intrachange" class="icon">

  <div class="subtitle">Browse completed games and review memorable matches</div>

<div class="load-more">

</div>

<div class="return-to-dashboard">

</div>

</html>
